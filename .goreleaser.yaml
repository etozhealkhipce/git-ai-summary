version: 2

project_name: git-ai-summary

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    binary: git-ai-summary
    ldflags:
      - -s
      - -w

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ .ProjectName }}-{{ .Version }}-
      {{- if eq .Os "darwin" -}}
        {{- if eq .Arch "arm64" }}aarch64-apple-darwin{{- else }}x86_64-apple-darwin{{- end -}}
      {{- else if eq .Os "linux" -}}
        {{- if eq .Arch "arm64" }}aarch64-unknown-linux-gnu{{- else }}x86_64-unknown-linux-gnu{{- end -}}
      {{- else -}}
        {{- if eq .Arch "arm64" }}aarch64-pc-windows-msvc{{- else }}x86_64-pc-windows-msvc{{- end -}}
      {{- end -}}

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

changelog:
  skip: true

release:
  github:
    owner: etozhealkhipce
    name: git-ai-summary
